<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AeroTrack Pro - Flight Analysis</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #cbd5e1;
      --accent: #3b82f6;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
    }

    header {
      padding: 1rem 2rem;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .main-container {
      padding: 20px;
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .grid-top {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    @media (max-width: 768px) {
      .grid-top {
        grid-template-columns: 1fr;
      }
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    select,
    button,
    input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0f172a;
      color: white;
      font-size: 1rem;
      box-sizing: border-box;
    }

    button {
      background: var(--accent);
      cursor: pointer;
      font-weight: bold;
      border: none;
      margin-top: 5px;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      background: #475569;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: #475569;
      margin-top: 10px;
      font-size: 0.85rem;
    }

    #map {
      height: 350px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .control-label {
      font-size: 0.75rem;
      color: var(--muted);
      font-weight: bold;
      text-transform: uppercase;
    }

    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .turbli-card {
      background: #ffffff;
      color: #1e293b;
      border-radius: 12px;
      padding: 20px;
    }

    .turbli-wrapper {
      display: flex;
      height: 320px;
      margin-top: 15px;
      position: relative;
    }

    .severity-bar {
      width: 40px;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #e2e8f0;
      margin-bottom: 30px;
      border-radius: 4px 0 0 4px;
      overflow: hidden;
    }

    .sev-zone {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      font-size: 0.65rem;
      font-weight: 800;
      text-transform: uppercase;
      color: rgba(0, 0, 0, 0.6);
    }

    .chart-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      font-size: 0.8rem;
      justify-content: center;
      margin-bottom: 10px;
      color: #475569;
      font-weight: 500;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .table-container {
      margin-top: 20px;
      background: #f8fafc;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      color: #1e293b;
      font-size: 0.85rem;
      text-align: center;
      min-width: 400px;
    }

    th {
      background: #f1f5f9;
      padding: 10px 4px;
      border-bottom: 2px solid #e2e8f0;
      color: #475569;
      font-size: 0.8rem;
      line-height: 1.2;
    }

    td {
      padding: 10px 4px;
      border-bottom: 1px solid #e2e8f0;
    }

    th:first-child,
    td:first-child {
      text-align: left;
      padding-left: 10px;
      font-variant-numeric: tabular-nums;
    }

    th:last-child,
    td:last-child {
      padding-right: 10px;
      font-size: 1rem;
    }

    tr:nth-child(even) {
      background: #ffffff;
    }

    tr:nth-child(odd) {
      background: #f9fafb;
    }

    .briefing-box {
      background: #eff6ff;
      border-left: 4px solid var(--accent);
      padding: 20px;
      margin-top: 20px;
      border-radius: 0 8px 8px 0;
      color: #1e40af;
      font-size: 0.9rem;
    }

    .briefing-box h4 {
      margin-top: 0;
      color: #1e3a8a;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge {
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: bold;
      white-space: nowrap;
      display: inline-block;
      margin: 2px 0;
    }

    .b-ok {
      background: #dcfce7;
      color: #166534;
    }

    .b-cat {
      background: #fee2e2;
      color: #991b1b;
    }

    .b-nubes {
      background: #e0e7ff;
      color: #3730a3;
    }

    .b-sat {
      background: #cffafe;
      color: #0891b2;
      border: 1px solid #06b6d4;
    }

    /* Modal Styles */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
      box-sizing: border-box;
    }

    .modal-content {
      background: white;
      color: #1e293b;
      max-width: 800px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      border-radius: 12px;
      padding: 30px;
      position: relative;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    }

    .close-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: #f1f5f9;
      color: #475569;
      width: 35px;
      height: 35px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.2rem;
      cursor: pointer;
      border: none;
      font-weight: bold;
    }

    .info-section {
      margin-bottom: 25px;
      padding-bottom: 20px;
      border-bottom: 1px solid #e2e8f0;
    }

    .info-section:last-child {
      border-bottom: none;
    }

    .info-title {
      color: #1e3a8a;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 0;
    }

    .info-text {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #334155;
    }

    .info-callout {
      background: #f8fafc;
      border-left: 4px solid #3b82f6;
      padding: 15px;
      margin: 15px 0;
      border-radius: 0 8px 8px 0;
      font-size: 0.9rem;
    }


    /* Language & Ko-fi buttons */
    #langBtn,
    .kofi-btn {
      width: auto;
      padding: 6px 14px;
      margin: 0;
      font-size: 1.1rem;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--border);
      border-radius: 20px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text);
      text-decoration: none;
    }

    #langBtn:hover,
    .kofi-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .kofi-btn {
      font-size: 0.9rem;
      font-weight: bold;
      background: #ff5e5b;
      /* Ko-fi brand color */
      color: white;
      border: none;
      white-space: nowrap;
    }

    .kofi-btn:hover {
      background: #ff4744;
      transform: scale(1.05);
    }

    @media (max-width: 480px) {
      .kofi-btn {
        font-size: 0.75rem;
        padding: 5px 10px;
        gap: 4px;
      }
      #langBtn {
        font-size: 0.9rem;
        padding: 5px 10px;
      }
    }
  </style>
</head>

<body>




  <header>
    <div>
      <div style="font-weight: 900; font-size: 1.2rem;">AeroTrack <span style="color:var(--accent)">PRO</span></div>
      <div id="headerSub" style="color: var(--muted); font-size: 0.8rem;"></div>
    </div>
    <div style="display: flex; gap: 10px; align-items: center;">
      <a href="https://buy.stripe.com/cNi14o4L52bQ7s02nsfYY00" target="_blank" rel="noopener noreferrer" id="kofiBtn"
        class="kofi-btn" data-i18n="kofiBtn">☕ Invítame a un café</a>
      <button id="langBtn" onclick="toggleLang()" title="Switch language"></button>
    </div>
  </header>




  <div class="main-container">
    <div class="panel">
        <div class="row-2">
          <div class="control-group">
            <span class="control-label" data-i18n="origin"></span>
            <select id="origSelect" onchange="fetchFlights()"></select>
          </div>
          <div class="control-group">
            <span class="control-label" data-i18n="destination"></span>
            <select id="destSelect" onchange="fetchFlights()"></select>
          </div>
        </div>

        <div class="row-2">
          <div class="control-group">
            <span class="control-label" data-i18n="departureDay"></span>
            <select id="daySelect" onchange="fetchFlights()">
              <option value="today" data-i18n="today"></option>
              <option value="tomorrow" data-i18n="tomorrow"></option>
            </select>
          </div>

          <div class="control-group" id="flightBox">
            <span class="control-label" data-i18n="flightLabel"></span>
            <select id="flightSelect">
              <option value="" data-i18n="loading"></option>
            </select>
          </div>

          <div class="control-group" id="manualTimeBox" style="display:none;">
            <span class="control-label" data-i18n="manualTime"></span>
            <input type="time" id="manualTime" value="12:00">
          </div>
        </div>

        <button type="button" id="btnCompute" data-i18n="analyzeBtn"></button>
      </div>

    <div class="turbli-card">
      <h3 id="dualTitle" style="margin-top:0; margin-bottom: 5px;"></h3>

      <div class="chart-legend">
        <div class="legend-item"><span style="width:16px; height:4px; background:#1e3a8a; display:inline-block;"></span>
          <span data-i18n="legendEDR"></span>
        </div>
        <div class="legend-item"><span
            style="width:16px; height:2px; border-top:3px dashed #ef4444; display:inline-block;"></span> <span
            data-i18n="legendShear"></span></div>
      </div>

      <div class="turbli-wrapper">
        <div style="flex-grow:1; position:relative;">
          <canvas id="mainChart"></canvas>
        </div>
      </div>

      <div class="table-container">
        <table id="dataTable">
          <thead>
            <tr>
              <th data-i18n="thTime"></th>
              <th data-i18n="thWind"></th>
              <th data-i18n="thShear"></th>
              <th data-i18n="thCause"></th>
              <th>EDR</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td colspan="5" id="tableEmpty" style="padding: 20px; color: #94a3b8;"></td>
            </tr>
          </tbody>
        </table>
      </div>

      <div id="briefing" class="briefing-box" style="display:none;">
        <h4>
          <svg width="20" height="20" fill="currentColor" viewBox="0 0 20 20">
            <path
              d="M11 3a1 1 0 10-2 0v1a1 1 0 102 0V3zM15.657 5.757a1 1 0 00-1.414-1.414l-.707.707a1 1 0 001.414 1.414l.707-.707zM18 10a1 1 0 01-1 1h-1a1 1 0 110-2h1a1 1 0 011 1zM5.05 6.464A1 1 0 106.464 5.05l-.707-.707a1 1 0 00-1.414 1.414l.707.707zM5 10a1 1 0 01-1 1H3a1 1 0 110-2h1a1 1 0 011 1zM8 16v-1a1 1 0 112 0v1a1 1 0 11-2 0zM13.536 14.95a1 1 0 011.414 1.414l-.707.707a1 1 0 01-1.414-1.414l.707-.707zM16.243 17.243a1 1 0 01-1.414 0l-.707-.707a1 1 0 111.414-1.414l.707.707a1 1 0 010 1.414z">
            </path>
          </svg>
          <span data-i18n="briefingTitle"></span>
        </h4>
        <div id="briefingContent"></div>
      </div>

      <button type="button" id="btnOpenInfo" class="btn-secondary" data-i18n="infoBtn"></button>
    </div>
  </div>

  <!-- INFO MODAL -->
  <div id="infoModal" class="modal-overlay">
    <div class="modal-content">
      <button class="close-btn" id="btnCloseInfo">✕</button>

      <div class="info-section">
        <h2 class="info-title" data-i18n="modal1Title"></h2>
        <div class="info-text" data-i18n-html="modal1Text"></div>
      </div>

      <div class="info-section">
        <h3 class="info-title" data-i18n="modal2Title"></h3>
        <div class="info-text" data-i18n-html="modal2Text"></div>
      </div>

      <div class="info-section">
        <h3 class="info-title" data-i18n="modal3Title"></h3>
        <div class="info-text" data-i18n-html="modal3Text"></div>
      </div>

      <div class="info-section">
        <h3 class="info-title" data-i18n="modal4Title"></h3>
        <div class="info-text" data-i18n-html="modal4Text"></div>
      </div>

      <div class="info-section">
        <h3 class="info-title" data-i18n="modal5Title"></h3>
        <div class="table-container" style="margin-top: 10px;">
          <table>
            <thead>
              <tr>
                <th data-i18n="thTime"></th>
                <th data-i18n="thWind"></th>
                <th data-i18n="thShear"></th>
                <th data-i18n="thCause"></th>
                <th>EDR</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td style="font-weight:bold;">14:30</td>
                <td style="color:#64748b;">45</td>
                <td style="color:#ef4444; font-weight:600;">10</td>
                <td style="line-height:1.4;"><span class="badge b-ok" data-i18n="stable"></span></td>
                <td style="color:#059669; font-weight:bold;">5.2</td>
              </tr>
              <tr>
                <td style="font-weight:bold;">14:45</td>
                <td style="color:#64748b;">180</td>
                <td style="color:#ef4444; font-weight:600;">85</td>
                <td style="line-height:1.4;"><span class="badge b-cat">CAT 🌬️</span><br><span class="badge b-sat"
                    data-i18n="thermalShock"></span></td>
                <td style="color:#d97706; font-weight:bold;">22.4</td>
              </tr>
            </tbody>
          </table>
        </div>
        <p class="info-text" style="margin-top: 15px;" data-i18n-html="modal5Text"></p>
      </div>

    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>

    // ─────────────────────────────────────────────────────
    // i18n TRANSLATIONS
    // ─────────────────────────────────────────────────────
    const TRANSLATIONS = {
      es: {
        // Header
        headerSub: "Despacho Avanzado: EDR, VWS, SAT & Nubes",
        langBtnLabel: "🇬🇧 EN",
        kofiBtn: "☕ Invítame a un café",
        // Controls
        origin: "Origen",
        destination: "Destino",
        departureDay: "Día de salida",
        today: "Hoy",
        tomorrow: "Mañana",
        flightLabel: "Vuelo (Hora Z)",
        loading: "Cargando...",
        manualTime: "Hora Manual (UTC)",
        analyzeBtn: "ANALIZAR PLAN DE VUELO",
        // Results panel
        dualTitle: "Análisis Atmosférico Dual",
        legendEDR: "Turbulencia (EDR)",
        legendShear: "Cizalladura (Δ)",
        sevSev: "Sev",
        sevMod: "Mod",
        sevLgt: "Lgt",
        thTime: "Hora\n(Z)",
        thWind: "Viento\nkm/h",
        thShear: "Δ Ciz.\nkm/h",
        thCause: "Causa / Avisos",
        tableEmpty: 'Selecciona una ruta y pulsa "Analizar Plan de Vuelo"',
        briefingTitle: "Briefing Predictivo",
        infoBtn: "📖 INFO TURBULENCIAS Y METEOROLOGÍA",
        // Badges
        stable: "Estable",
        clouds: "Nubes ☁️",
        thermalShock: "🧊 Choque Térmico",
        // Briefing
        briefingMinutes: (mod) => `Tu vuelo presenta <b>${mod} minutos</b> proyectados de turbulencia moderada o superior.`,
        briefingCAT: (cat) => `<li><b>${cat} min de Aire Claro (CAT):</b> Turbulencia invisible causada por choques térmicos en el aire.</li>`,
        briefingClouds: (n) => `<li><b>${n} min Convectiva (Nubes):</b> Causada por el cruce de formaciones nubosas altas.</li>`,
        briefingSmooth: `<li><b>Inestabilidad baja:</b> Vuelo en condiciones atmosféricas óptimas.</li>`,
        briefingSAT: (s) => `<li><b style="color:#0891b2;">¡Atención SAT!</b> Se han detectado ${s} cambios bruscos de temperatura. Posible cruce del núcleo del Jet Stream.</li>`,
        // Fetch messages
        sameSrcDest: "El origen y destino son iguales",
        searching: "Buscando vuelos...",
        // Modal
        modal1Title: "🧠 El Miedo a Volar: Un truco del cerebro",
        modal1Text: `<p>El miedo a la turbulencia no proviene del peligro real (los aviones están diseñados para soportar fuerzas inmensamente superiores a las peores turbulencias de la historia), sino de la <b>incertidumbre</b>. Nuestro cerebro está programado para alertarnos ante lo inesperado.</p><p>Cuando vas en coche y ves un bache en la carretera, tu cerebro se prepara. En un avión, el aire es invisible. Al no ver el "bache", tu sistema nervioso reacciona con ansiedad. <b>El objetivo de AeroTrack Pro es hacer visible lo invisible.</b> Cuando sabes a qué hora exacta va a temblar el avión y <i>por qué</i> está temblando, la incertidumbre desaparece, tu cerebro se relaja y el miedo se disipa.</p>`,
        modal2Title: "🌬️ Turbulencia y el Índice EDR",
        modal2Text: `<p><b>¿Qué es?</b> Es simplemente aire en movimiento irregular. Imagina un río que fluye tranquilo y de repente pasa sobre unas rocas bajo el agua, creando espuma y pequeños remolinos en la superficie. El avión es como un barco navegando por ese río.</p><p><b>¿Cómo lo siente el pasajero?</b> Como ir por un camino de tierra en un todoterreno. El avión da pequeños botes. <br>En nuestra tabla, esto se mide con el valor <b>EDR</b> (<i>Eddy Dissipation Rate</i>). Un EDR por debajo de 15 es un vuelo muy tranquilo. Entre 15 y 20 notarás que la bebida tiembla.</p>`,
        modal3Title: "⚠️ Cizalladura (Wind Shear)",
        modal3Text: `<p><b>¿Qué es?</b> Es un cambio brusco en la velocidad o la dirección del viento en una distancia muy corta. Imagina que vas corriendo con viento a favor, y de repente el viento cambia y te da de cara.</p><p><b>¿Cómo lo siente el pasajero?</b> Puedes sentir una ligera sensación de "caída en el estómago" por un segundo (como en una montaña rusa) o escuchar cómo los motores del avión aceleran o desaceleran repentantemente. No es que el avión esté fallando; son los pilotos (o el piloto automático) ajustando la potencia para adaptarse al nuevo viento.</p><div class="info-callout">En la tabla lo verás en la columna <b>Δ Ciz.</b> Si este número sube repentinamente, espera cambios en el ruido de los motores y posibles sacudidas verticales.</div>`,
        modal4Title: "✈️ Corriente en Chorro (Jet Stream) y Choques Térmicos",
        modal4Text: `<p><b>¿Qué es?</b> Las corrientes en chorro son "autopistas" de viento muy rápido (a veces más de 300 km/h) situadas a gran altitud. Los aviones las buscan para ahorrar combustible cuando van a favor. Los bordes de estas autopistas tienen diferencias drásticas de temperatura.</p><p><b>¿Cómo lo siente el pasajero?</b> Cuando el avión cruza el borde para entrar o salir de esta autopista de viento, el cambio repentino de temperatura del aire (choque térmico) crea turbulencia de aire claro (CAT). Es invisible y repentina.</p><div class="info-callout">Si en la tabla ves el aviso <span class="badge b-sat">🧊 Choque Térmico</span> junto a <span class="badge b-cat">CAT 🌬️</span>, significa que a esa hora exacta el avión estará cruzando uno de los márgenes del Jet Stream. ¡Abróchate el cinturón y disfruta de la física atmosférica en acción!</div>`,
        modal5Title: "📊 Cómo leer nuestra predicción (Ejemplo)",
        modal5Text: `<b>Traducción:</b> A las 14:30 estarás tomando un café tranquilamente (EDR 5.2). Pero a las 14:45, el avión entrará en una zona de vientos fuertes (180 km/h) con un cambio brusco de temperatura. Notarás zarandeos moderados (EDR 22.4) y puede que escuches los motores ajustar potencia por la alta cizalladura (85). Sabrás exactamente qué está pasando y cuánto va a durar.`,
      },

      en: {
        // Header
        headerSub: "Advanced Dispatch: EDR, VWS, SAT & Clouds",
        langBtnLabel: "🇪🇸 ES",
        kofiBtn: "☕ Buy me a coffee",
        // Controls
        origin: "Origin",
        destination: "Destination",
        departureDay: "Departure day",
        today: "Today",
        tomorrow: "Tomorrow",
        flightLabel: "Flight (Zulu)",
        loading: "Loading...",
        manualTime: "Manual Time (UTC)",
        analyzeBtn: "ANALYZE FLIGHT PLAN",
        // Results panel
        dualTitle: "Dual Atmospheric Analysis",
        legendEDR: "Turbulence (EDR)",
        legendShear: "Wind Shear (Δ)",
        sevSev: "Sev",

    function generateFallbackSchedule(orig, dest) {
      const carriers = ["IB", "VY", "UX", "VK"];
      let route_hash = 0;
      for (let i = 0; i < (orig + dest).length; i++) route_hash += (orig + dest).charCodeAt(i);

      const num_flights = 4 + (route_hash % 5);
      const base_hour = 6 + (route_hash % 2);
      const spacing = Math.max(2, Math.floor((22 - base_hour) / num_flights));

      const flights = [];
      for (let i = 0; i < num_flights; i++) {
        let h = Math.min(base_hour + i * spacing, 22);
        let m = Math.floor(((route_hash * (i + 1)) % 60) / 5) * 5;
        let carrier = carriers[(route_hash + i) % carriers.length];
        let num = 1000 + ((route_hash + i * 37) % 8000);

        let hh = h.toString().padStart(2, '0');
        let mm = m.toString().padStart(2, '0');
        flights.push({ depTime: `${hh}:${mm}`, flight: `${carrier}${num}` });
      }
      return flights.sort((a, b) => a.depTime.localeCompare(b.depTime));
    }

    function getLocalFlights(orig, dest, day) {
      const key = `${orig}-${dest}`;
      let flights = SCHEDULE_DB[key] || generateFallbackSchedule(orig, dest);

      if (day === 'today') {
        const now = new Date();
        const currentMin = now.getUTCHours() * 60 + now.getUTCMinutes();

        const upcoming = flights.filter(f => {
          const [h, m] = f.depTime.split(':').map(Number);
          return (h * 60 + m) >= currentMin;
        });

        flights = upcoming.length > 0 ? upcoming : flights.slice(-2);
      }
      return flights;
    }

      return date.getHours().toString().padStart(2, '0') + ':' + date.getMinutes().toString().padStart(2, '0');

      tableBody.innerHTML = "";

      let modMinutes = 0, nubesMinutes = 0, catMinutes = 0, satShocks = 0;
      let maxWind = 0;
      let prevSat = null;

      for (let i = 0; i <= 12; i++) {
        const f = i / 12;
        const lat = startCoords.lat + (endCoords.lat - startCoords.lat) * f;

        const vws = Math.abs(w250 - w300);
        const impactoNubes = nubesAltas > 50 ? (nubesAltas * 0.15) : 0;
        const atmosphericNoise = Math.sin(i * 0.8) * 3 + (Math.random() * 4);
        let edr = (vws * 0.45) + (w250 * 0.03) + impactoNubes + atmosphericNoise;

        const label = i === 0 ? `${currentOrig} (${realTime})` : i === 12 ? `${currentDest} (${realTime})` : realTime;

        dataPoints.push({ label, edr, vws, w250 });

        tableBody.innerHTML += `<tr>
        <td style="font-weight:bold;">${label}</td>
        <td style="color:#64748b;">${w250.toFixed(0)}</td>
        <td style="color:#ef4444; font-weight:600;">${vws.toFixed(0)}</td>
        <td style="line-height:1.4;"><span class="badge ${causaClase}">${causaTxt}</span>${satWarning}</td>
        <td style="color:${edr > 20 ? '#d97706' : '#059669'}; font-weight:bold;">${edr.toFixed(1)}</td>
      </tr>`;

        L.circleMarker([lat, lon], { radius: 6, color: edr > 20 ? '#fbbf24' : '#3b82f6', fillOpacity: 0.8 }).addTo(dotsLayer);
      }

      renderChart(dataPoints);
      generateBriefing(modMinutes, catMinutes, nubesMinutes, satShocks);
      btn.disabled = false;
    }

    function renderChart(points) {
      const t = TRANSLATIONS[currentLang];
      if (mainChart) mainChart.destroy();
      mainChart = new Chart($('mainChart'), {
        type: 'line',
        data: {
          labels: points.map(p => p.label),
          datasets: [
            { label: 'EDR', data: points.map(p => p.edr), borderColor: '#1e3a8a', borderWidth: 3, tension: 0.4, pointRadius: 2, fill: true, backgroundColor: 'rgba(59, 130, 246, 0.1)', yAxisID: 'y' },
            { label: t.legendShear, data: points.map(p => p.vws), borderColor: '#ef4444', borderWidth: 2, borderDash: [4, 4], tension: 0.3, pointRadius: 0, fill: false, yAxisID: 'y1' }
          ]
        },
        options: {
          maintainAspectRatio: false,
          plugins: { legend: { display: false }, tooltip: { mode: 'index', intersect: false } },
          scales: {
            x: { ticks: { color: '#64748b', maxRotation: 45, minRotation: 45 } },
            y: { type: 'linear', display: true, position: 'left', min: 0, max: 60, ticks: { color: '#1e3a8a' } },
            y1: { type: 'linear', display: true, position: 'right', min: 0, max: 100, ticks: { color: '#ef4444' }, grid: { drawOnChartArea: false } }
          }
        }
      });
    }

    function generateBriefing(mod, cat, nubes, satShocks) {
      const t = TRANSLATIONS[currentLang];
      const briefing = $('briefing');
      const content = $('briefingContent');
      briefing.style.display = 'block';

      let text = `<p style="margin-top:0">${t.briefingMinutes(mod)}</p>`;
      text += `<ul style="margin-bottom:0; padding-left: 20px;">`;
      if (mod > 0) {
        if (cat > 0) text += t.briefingCAT(cat);
        if (nubes > 0) text += t.briefingClouds(nubes);
      } else {
        text += t.briefingSmooth;
      }
      if (satShocks > 0) text += t.briefingSAT(satShocks);
      text += `</ul>`;

      content.innerHTML = text;
    }

    // Modal logic
    const modal = $('infoModal');
    $('btnOpenInfo').onclick = () => { modal.style.display = 'flex'; };
    $('btnCloseInfo').onclick = () => { modal.style.display = 'none'; };
    window.onclick = (e) => { if (e.target == modal) modal.style.display = "none"; }

    // ─────────────────────────────────────────────────────
    // INIT
    // ─────────────────────────────────────────────────────
    window.onload = async () => {
      await detectLang();
      applyTranslations();
      initMap();
    };
    $('btnCompute').onclick = compute;

    // Service Worker registration
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(console.warn);
    }
  </script>
</body>

</html>
